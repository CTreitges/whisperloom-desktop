name: Release
# Tag v* → Tests → publish + vpk pack (win-x64, linux-x64) → GitHub-Release als Entwurf (Veröffentlichen erst nach OK).
# Ohne Signierschritt: die Firma signiert selbst (docs/signing.md).
# Probelauf: workflow_dispatch mit dry_run=true (Standard) und jeder PR, der Release-Dateien ändert; baut und packt alles,
# lädt die Pakete nur als Workflow-Artefakte hoch, nie als Release.
# Doku: docs.velopack.io/distributing/github-actions, docs.velopack.io/packaging/cross-compiling (abgerufen 2026-11-01),
# docs.github.com/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows,
# cli.github.com/manual/gh_release_create (abgerufen 2026-11-01).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probelauf: nichts als Release hochladen"
        type: boolean
        default: true
      version:
        description: "Version (SemVer, ohne v)"
        type: string
        default: "0.0.1-dryrun"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "build/**"
      - "dotnet-tools.json"
      - "src/WhisperLoom.App/Updates/**"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - id: v
        shell: bash
        # Eingaben nur über env, nie direkt in das Skript (Script-Injection).
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"; dry_run=false
          elif [ "$EVENT" = workflow_dispatch ]; then
            version="$IN_VERSION"; dry_run="$IN_DRY_RUN"
          else
            version="0.0.1-dryrun.$RUN_NUMBER"; dry_run=true
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version ist kein SemVer: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "Version $version, dry_run=$dry_run"

  test:
    needs: meta
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: dotnet test WhisperLoom.slnx -c Release
      - run: python -m unittest discover -s build/tests -v

  pack:
    needs: [meta, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # Ohne Delta-Pakete: jeder Release enthält nur volle Pakete dieser Version (kein vpk download nötig).
      - name: publish + vpk pack
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          RID: ${{ matrix.rid }}
        run: python build/pack.py --version "$VERSION" --rid "$RID" --out Releases --work work
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          path: Releases/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [meta, pack]
    if: needs.meta.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: Releases
          merge-multiple: true
      # Entwurf: Velopack (GithubSource) sieht erst den veröffentlichten Release; veröffentlichen nach Christofs OK.
      - name: GitHub-Release (Entwurf)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ls -la Releases
          gh release create "v$VERSION" Releases/* --draft --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WhisperLoom $VERSION" \
            --notes "Windows: WhisperLoom-win-Setup.exe (pro Benutzer, ohne Admin) oder WhisperLoom-$VERSION-win-x64-portable.zip. Linux: WhisperLoom.AppImage. Unsigniert, siehe docs/signing.md."
