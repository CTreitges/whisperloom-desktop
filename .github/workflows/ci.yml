name: CI
on:
  push: { branches: [main] }
  # Alle PRs, auch gestapelte (Base ≠ main).
  pull_request:

# Review N-10: nur lesen; Actions per voller SHA wie in release.yml.
permissions:
  contents: read

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      - run: dotnet restore WhisperLoom.slnx
      - run: dotnet build WhisperLoom.slnx -c Release --no-restore
      - run: dotnet test WhisperLoom.slnx -c Release --no-build

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Paritätsquelle: öffentliches Android-Repo (nur lesen).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: CTreitges/whisperloom-android, path: android }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/test_parity.py --android android --mapping docs/test-mapping-contracts.md --mapping docs/test-mapping-text.md --mapping docs/test-mapping-api.md --mapping docs/test-mapping-local.md
      - run: python tools/check_prompt_parity.py --android android
      - run: python tools/check_provider_parity.py --android android
      - run: python tools/check_i18n.py

  # Demo-Pakete der App (self-contained). Doku: learn.microsoft.com/dotnet/core/deploying/ (abgerufen 2026-10-30),
  # github.com/actions/upload-artifact (v7, abgerufen 2026-10-30).
  publish:
    needs: dotnet
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, archive: win-x64.zip }
          - { os: ubuntu-latest, rid: linux-x64, archive: linux-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { global-json-file: global.json }
      # Gleiche Schalter wie build/pack.py (PERF-3: ReadyToRun, Composite nur Linux), damit Fehler vor dem Release-Tag auffallen.
      - run: dotnet publish src/WhisperLoom.App -c Release -r ${{ matrix.rid }} --self-contained -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=${{ startsWith(matrix.rid, 'linux') }} -o publish/${{ matrix.rid }}
      # Starttest der vorkompilierten Binärdatei (Abschlussprüfung M1: Linux-Composite lief sonst nie): --version endet vor
      # dem UI-Start und braucht kein Display.
      - if: runner.os == 'Linux'
        run: ./publish/linux-x64/WhisperLoom --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/win-x64/WhisperLoom.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "WhisperLoom --version: Exit $($p.ExitCode)" }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ${{ matrix.archive }}
      - if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C publish/linux-x64 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
