{% extends "base.html" %}
{% block titel %}{{ t('p.login_titel') }}{% endblock %}
{% block inhalt %}
<section class="karte">
  <h1>{{ t('p.login_titel') }}</h1>
  <p class="klein">{{ t('p.login_text') }}</p>
  {% if fehler %}<p class="meldung fehler" role="alert">{{ t(fehler) }}</p>{% endif %}
  <form method="post" action="/login" class="formular">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="benutzername">{{ t('p.benutzername') }}</label>
    <input id="benutzername" name="benutzername" autocomplete="username" required maxlength="64" autocapitalize="none" autofocus>
    <label for="passwort">{{ t('p.passwort') }}</label>
    <input id="passwort" name="passwort" type="password" autocomplete="current-password" required maxlength="256">
    <button type="submit" class="knopf haupt">{{ t('p.anmelden') }}</button>
  </form>
  <p class="klein">{{ t('p.login_vergessen') }}</p>
</section>
{% endblock %}
