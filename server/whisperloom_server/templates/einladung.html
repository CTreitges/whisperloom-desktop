{% extends "base.html" %}
{% block titel %}{{ t('p.einladung_titel') }}{% endblock %}
{% block inhalt %}
<section class="karte">
  <h1>{{ t('p.einladung_titel') }}</h1>
  <p>{{ t('p.einladung_text') }} <strong>{{ benutzer }}</strong></p>
  {% if fehler %}<p class="meldung fehler" role="alert">{{ t(fehler) }}</p>{% endif %}
  <form method="post" class="formular">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="text" name="benutzer" value="{{ benutzer }}" autocomplete="username" hidden>
    <label for="passwort">{{ t('p.neues_passwort') }}</label>
    <input id="passwort" name="passwort" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="pw-hinweis">
    <p id="pw-hinweis" class="klein">{{ t('p.pw_regel') }}</p>
    <label for="passwort2">{{ t('p.passwort_wiederholen') }}</label>
    <input id="passwort2" name="passwort2" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
    <button type="submit" class="knopf haupt">{{ t('p.passwort_setzen') }}</button>
  </form>
</section>
{% endblock %}
